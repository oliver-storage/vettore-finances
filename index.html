<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VA Business - Gestão Financeira</title>
  <link rel="stylesheet" href="css/landing.css">
</head>
<body>
  <div class="landing-container">
    <div class="landing-content">
      <h1>VA Business</h1>
      <p class="tagline">Sistema de Gestão de Contas a Receber</p>
      <p class="subtitle">Controle seus recebimentos com inteligência artificial</p>
      
      <div class="action-buttons">
        <button class="btn-login" onclick="goTo('html/login.html')">Entrar</button>
        <button class="btn-signup" onclick="goTo('html/cadastro.html')">Criar Conta</button>
      </div>
      
      <div class="features">
        <div class="feature">
          <span>📊</span>
          <p>Dashboards em Tempo Real</p>
        </div>
        <div class="feature">
          <span>🔄</span>
          <p>Importação Automática</p>
        </div>
        <div class="feature">
          <span>🤖</span>
          <p>Matching Inteligente</p>
        </div>
      </div>
    </div>
  </div>
  
  <script>
    function goTo(url) { window.location.href = url; }
    window.addEventListener('load', () => {
      const bg = localStorage.getItem('bg-landing');
      if (bg) document.body.style.background = bg;
    });
  </script>
</body>
</html>
