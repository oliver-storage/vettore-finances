<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testador de XLS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 {
      color: #333;
      border-bottom: 3px solid #1976d2;
      padding-bottom: 10px;
    }
    .upload-area {
      border: 2px dashed #1976d2;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      margin: 20px 0;
    }
    input[type="file"] {
      padding: 10px;
    }
    #output {
      margin-top: 30px;
      background: #fafafa;
      padding: 15px;
      border-left: 4px solid #1976d2;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      overflow-x: auto;
      max-height: 500px;
      overflow-y: auto;
    }
    .log-line {
      padding: 5px 0;
      line-height: 1.4;
    }
    .log-success { color: #2e7d32; }
    .log-error { color: #c62828; }
    .log-info { color: #1565c0; }
    .log-warn { color: #f57c00; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #1976d2;
      color: white;
    }
    tr:nth-child(even) {
      background: #f9f9f9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Testador de Importação XLS</h1>
    
    <div class="upload-area">
      <h3>Selecione um arquivo XLS/XLSX</h3>
      <input type="file" id="fileInput" accept=".xls,.xlsx,.csv" onchange="handleFile(event)">
    </div>
    
    <div id="output"></div>
    <table id="dataTable" style="display:none;"></table>
  </div>
  
  <script>
    const output = document.getElementById('output');
    
    function log(msg, type = 'info') {
      const div = document.createElement('div');
      div.className = `log-line log-${type}`;
      div.textContent = msg;
      output.appendChild(div);
      output.scrollTop = output.scrollHeight;
    }
    
    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      
      output.innerHTML = '';
      log(`📂 Arquivo: ${file.name}`, 'info');
      log(`📊 Tamanho: ${(file.size / 1024).toFixed(2)} KB`, 'info');
      log(`⏳ Processando...`, 'info');
      log('---', 'info');
      
      const reader = new FileReader();
      
      reader.onload = (evt) => {
        try {
          const data = evt.target.result;
          const workbook = XLSX.read(data, { type: 'array' });
          
          log(`✓ Planilhas detectadas: ${workbook.SheetNames.join(', ')}`, 'success');
          
          workbook.SheetNames.forEach((sheetName, idx) => {
            log(`\n📄 Folha ${idx + 1}: "${sheetName}"`, 'info');
            
            const worksheet = workbook.Sheets[sheetName];
            const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            log(`   Linhas: ${json.length}`, 'info');
            
            if (json.length > 0) {
              log(`   Colunas na linha 1: ${json[0].length}`, 'info');
              log(`\n   Primeiras 5 linhas:`, 'info');
              
              json.slice(0, 5).forEach((row, i) => {
                log(`   [${i}] ${JSON.stringify(row)}`, 'info');
              });
              
              // Detector de colunas
              log(`\n   🔍 Análise de Headers:`, 'warn');
              detectHeaders(json[0]);
              detectHeaders(json[1]);
              if (json[2]) detectHeaders(json[2]);
            }
          });
          
          log('\n✓ Arquivo processado com sucesso!', 'success');
          
        } catch (error) {
          log(`❌ Erro: ${error.message}`, 'error');
          console.error(error);
        }
      };
      
      reader.readAsArrayBuffer(file);
    }
    
    function detectHeaders(row) {
      if (!row) return;
      
      let found = [];
      row.forEach((col, idx) => {
        if (!col) return;
        const upper = String(col).toUpperCase().trim();
        
        if (upper.includes('DATA')) found.push(`COL[${idx}] = DATA`);
        if (upper.includes('DESCRIÇÃO') || upper.includes('DESCRICAO')) found.push(`COL[${idx}] = DESCRIÇÃO`);
        if (upper.includes('VALOR')) found.push(`COL[${idx}] = VALOR`);
        if (upper.includes('SALDO')) found.push(`COL[${idx}] = SALDO`);
        if (upper.includes('HISTÓRICO') || upper.includes('HISTORICO')) found.push(`COL[${idx}] = HISTÓRICO`);
      });
      
      if (found.length > 0) {
        found.forEach(f => log(`      ✓ ${f}`, 'success'));
      } else {
        log(`      ⚠️ Nenhuma coluna padrão detectada`, 'warn');
        log(`      Colunas: ${row.slice(0, 5).join(' | ')}`, 'info');
      }
    }
  </script>
</body>
</html>
