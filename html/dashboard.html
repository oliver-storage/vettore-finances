<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - VA Business</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <span class="logo">VA Business</span>
      <div class="menu">
        <a href="dashboard.html" class="menu-item active">Dashboard</a>
        <a href="extratos.html" class="menu-item">Extratos</a>
        <a href="configuracao.html" class="menu-item">Configuração</a>
      </div>
    </div>
    <div class="navbar-right">
      <span id="userName">Usuário</span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </nav>
  
  <main class="container">
    <h1>Dashboard</h1>
    <div class="grid-3">
      <div class="card">
        <h3>Franquias</h3>
        <p class="metric" id="countUnidades">0</p>
      </div>
      <div class="card">
        <h3>Usuários</h3>
        <p class="metric" id="countUsers">0</p>
      </div>
      <div class="card">
        <h3>Extratos</h3>
        <p class="metric" id="countExtratos">0</p>
      </div>
    </div>
  </main>
  
  <footer class="footer">
    <p>&copy; 2026 VA Business • Desenvolvido por OliverStorage • v1.0.1</p>
  </footer>
  
  <script src="../js/auth.js"></script>
  <script>
    checkAuth();
    const user = JSON.parse(localStorage.getItem('currentUser'));
    document.getElementById('userName').textContent = user.nome;
    document.getElementById('countUnidades').textContent = JSON.parse(localStorage.getItem('unidades') || '[]').length;
    document.getElementById('countUsers').textContent = JSON.parse(localStorage.getItem('usuarios') || '[]').length;
    document.getElementById('countExtratos').textContent = JSON.parse(localStorage.getItem('extratos') || '[]').length;
  </script>
</body>
</html>
