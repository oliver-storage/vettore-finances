<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - VA Business</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <span class="logo">VA Business</span>
      <div class="menu">
        <a href="dashboard.html" class="menu-item active">Dashboard</a>
        <a href="extratos.html" class="menu-item">Extratos</a>
        <a href="configuracao.html" class="menu-item">Configuração</a>
      </div>
    </div>
    <div class="navbar-right">
      <span id="userDisplay">Usuário</span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </nav>
  
  <main class="container">
    <h1>Dashboard</h1>
    
    <div class="grid-4">
      <div class="card">
        <h3>Usuários</h3>
        <p class="metric" id="countUsers">0</p>
      </div>
      <div class="card">
        <h3>Extratos</h3>
        <p class="metric" id="countExtratos">0</p>
      </div>
      <div class="card">
        <h3>Faturamento</h3>
        <p class="metric">R$ 0,00</p>
      </div>
      <div class="card">
        <h3>Taxa Matching</h3>
        <p class="metric">0%</p>
      </div>
    </div>
  </main>
  
  <script src="../js/auth.js"></script>
  <script>
    window.addEventListener('load', () => {
      checkAuth();
      const users = JSON.parse(localStorage.getItem('usuarios') || '[]');
      const extratos = JSON.parse(localStorage.getItem('extratos') || '[]');
      document.getElementById('countUsers').textContent = users.length;
      document.getElementById('countExtratos').textContent = extratos.length;
      
      const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
      document.getElementById('userDisplay').textContent = user.nome || 'Usuário';
    });
  </script>
</body>
</html>
