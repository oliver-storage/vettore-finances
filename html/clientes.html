<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - VA Business</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <span class="logo">VA Business</span>
      <div class="menu">
        <a href="dashboard.html" class="menu-item">Dashboards</a>
        <a href="clientes.html" class="menu-item active">Clientes</a>
        <a href="extratos.html" class="menu-item">Extratos</a>
        <a href="pagamentos.html" class="menu-item">Pagamentos</a>
        <a href="configuracao.html" class="menu-item">Configuração</a>
      </div>
    </div>
    <div class="navbar-right">
      <div class="user-info">
        <span class="user-name" id="userName">Usuário</span>
        <button class="logout-btn" onclick="logout()">Sair</button>
      </div>
    </div>
  </nav>
  
  <main class="container">
    <h1>Clientes</h1>
    <button class="btn-primary" onclick="alert('Em desenvolvimento')">+ Novo Cliente</button>
    
    <table id="clientesTable">
      <thead>
        <tr>
          <th>Nome</th>
          <th>CNPJ</th>
          <th>Status</th>
          <th>Faturamento</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbody-clientes">
        <tr>
          <td colspan="5" style="text-align: center; padding: 20px; color: #999;">Nenhum cliente cadastrado</td>
        </tr>
      </tbody>
    </table>
  </main>
  
  <script src="../js/main.js"></script>
</body>
</html>
