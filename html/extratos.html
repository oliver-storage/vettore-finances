  <style>
    /* Barra de progresso no topo */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: -100%;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--marca), var(--destaque), var(--marca));
      animation: progresso 2s infinite;
      z-index: 9999;
    }

    @keyframes progresso {
      0% { left: -100%; }
      50% { left: 100%; }
      100% { left: 100%; }
    }

    footer.footer {
      background: var(--topo-bg);
      color: rgba(255, 255, 255, 0.8);
      text-align: center;
      padding: 16px 20px;
      margin-top: 40px;
      border-top: 1px solid var(--linha);
      font-size: 12px;
    }

    footer.footer p {
      margin: 0;
    }
    /* 
    ═══════════════════════════════════════════════════════════════
    ANÁLISE SEMIÓTICA DA TABELA FINANCEIRA
    ═══════════════════════════════════════════════════════════════
    
    HIERARQUIA VISUAL:
    1. VALOR (R$) - Coluna mais importante
       • Destacado em cor (marca azul), maior peso tipográfico
       • Alinhado à direita (padrão financeiro internacional)
       • Coluna fixa para referência constante
    
    2. DATA + HISTÓRICO BANCO - Contexto
       • Fixas (referência durante scroll)
       • Data em cinza menor (metadado de caixa)
       • Histórico em tamanho maior (descrição)
    
    3. HISTÓRICO CORREÇÃO - Edição primária
       • Campo mais largo (280px) para texto descritivo
       • Placeholder guia o usuário
       • Primeira coluna editável após o trio fixo
    
    LEGIBILIDADE:
    • Padding 12px: respira melhor que 8px
    • Inputs 130px+: confortáveis para edição
    • Fonte 13px: legível sem zoom
    • Hover suave: feedback visual sem agressividade
    
    AFFORDANCE (Ação):
    • Botão "×" em vez de "Deletar" (ícone reconhecível)
    • Focus com sombra (não apenas borda)
    • Select com cursor pointer (indica interatividade)
    • Placeholders descritivos (guiam preenchimento)
    
    FLUXO DE LEITURA (LTR - Left to Right):
    Data → Histórico → Valor (trio fixo, lido primeiro)
       ↓ (scroll) → Correção → Categoria → Serviços → Cliente → Observação
    ═══════════════════════════════════════════════════════════════
    */
    .conta-info {
      background: var(--papel);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }
    
    .conta-item {
      border-left: 3px solid var(--marca);
      padding-left: 12px;
    }
    
    .conta-item label {
      font-size: 11px;
      color: var(--tinta-70);
      text-transform: uppercase;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    
    .conta-item value {
      font-size: 16px;
      color: var(--tinta);
      font-weight: 500;
      display: block;
    }

    .resumo-categorias {
      background: var(--papel);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .categoria-box {
      text-align: center;
      padding: 12px;
      background: var(--papel-alto);
      border-radius: 6px;
      border-top: 2px solid var(--marca);
    }

    .categoria-box label {
      font-size: 11px;
      color: var(--tinta-70);
      text-transform: uppercase;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }

    .categoria-box value {
      font-size: 14px;
      color: var(--marca);
      font-weight: 600;
      display: block;
    }

    table input, table select {
      font-size: 12px;
    }

    .table-wrapper {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--linha);
    }

    #tabelaExtratos {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    /* COLUNAS FIXAS - HIERARQUIA VISUAL */
    #tabelaExtratos th:nth-child(1),
    #tabelaExtratos td:nth-child(1) {
      position: sticky;
      left: 0;
      background: var(--papel-alto);
      z-index: 10;
      min-width: 80px;
      text-align: center;
      font-weight: 400;
      font-size: 13px;
    }

    #tabelaExtratos th:nth-child(2),
    #tabelaExtratos td:nth-child(2) {
      position: sticky;
      left: 80px;
      background: var(--papel-alto);
      z-index: 10;
      min-width: 320px;
      padding-left: 16px;
    }

    #tabelaExtratos th:nth-child(3),
    #tabelaExtratos td:nth-child(3) {
      position: sticky;
      left: 400px;
      background: var(--papel-alto);
      z-index: 10;
      min-width: 140px;
      text-align: right;
      padding-right: 16px;
    }

    #tabelaExtratos thead th {
      background: var(--marca);
      color: white;
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 14px 12px;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Override: manter azul nas colunas fixas do header */
    #tabelaExtratos thead th:nth-child(1),
    #tabelaExtratos thead th:nth-child(2),
    #tabelaExtratos thead th:nth-child(3) {
      background: var(--marca);
      color: white;
    }

    #tabelaExtratos tbody tr {
      border-bottom: 1px solid var(--linha);
      transition: background 0.15s ease;
    }

    #tabelaExtratos tbody tr:hover {
      background: var(--papel);
    }

    #tabelaExtratos td {
      padding: 12px 12px;
      vertical-align: middle;
    }

    /* COLUNAS COM LARGURA ESPECÍFICA */
    #tabelaExtratos td:nth-child(4) { min-width: 100px; }
    #tabelaExtratos td:nth-child(5) { min-width: 120px; }
    #tabelaExtratos td:nth-child(6) { min-width: 280px; }
    #tabelaExtratos td:nth-child(7) { min-width: 160px; }
    #tabelaExtratos td:nth-child(8) { min-width: 180px; }
    #tabelaExtratos td:nth-child(9) { min-width: 180px; }
    #tabelaExtratos td:nth-child(10) { min-width: 200px; }
    #tabelaExtratos td:nth-child(11) { min-width: 100px; text-align: center; }

    #tabelaExtratos input,
    #tabelaExtratos select {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--linha);
      border-radius: 4px;
      font-family: 'IBM Plex Sans', sans-serif;
      transition: border-color 0.2s ease;
      background: var(--papel-alto);
      color: var(--tinta);
    }

    #tabelaExtratos input::placeholder {
      color: var(--tinta-40);
      font-size: 12px;
      font-style: italic;
    }

    #tabelaExtratos select option {
      color: var(--tinta);
      background: var(--papel-alto);
    }

    #tabelaExtratos input:focus,
    #tabelaExtratos select:focus {
      outline: none;
      border-color: var(--marca);
      box-shadow: 0 0 0 3px rgba(31, 85, 165, 0.12);
      background: white;
    }

    #tabelaExtratos select {
      cursor: pointer;
    }

    .btn-danger {
      padding: 8px 12px;
      font-size: 16px;
      font-weight: 300;
      white-space: nowrap;
      background: #f5f5f5;
      border: 1px solid var(--linha);
      color: var(--tinta-70);
      transition: all 0.15s ease;
    }

    .btn-danger:hover {
      background: #e8e8e8;
      color: var(--alerta);
      border-color: var(--alerta);
    }

    .btn-menu {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      color: var(--tinta-70);
      transition: color 0.2s;
    }

    .btn-menu:hover {
      color: var(--marca);
    }

    .menu-acoes {
      display: flex;
      flex-direction: column;
    }

    .menu-item {
      background: none;
      border: none;
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      font-size: 12px;
      color: var(--tinta);
      border-bottom: 1px solid var(--linha);
      transition: background 0.15s;
      white-space: nowrap;
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .menu-item:hover {
      background: var(--papel);
      color: var(--marca);
    }
</head>

  <script>
    const CATEGORIAS = [
      'BOLETOS', 'CUSTEIO', 'DAE CLIENTE', 'ENDEREÇO FISCAL',
      'HONORÁRIOS', 'NEGOCIAÇÃO', 'PARCEIROS', 'SERVIÇOS', 'TARIFAS', 'SALDO ANTERIOR'
    ];

    function formatarMoedaBR(valor) {
      return parseFloat(valor || 0).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
    }

    function formatarValorComSinal(valor) {
      const v = parseFloat(valor || 0);
      const formatado = Math.abs(v).toLocaleString('pt-BR', {
        style: 'currency',
        currency: 'BRL'
      });
      return v >= 0 ? `+ ${formatado}` : `- ${formatado}`;
    }

    function corValor(valor) {
      return parseFloat(valor || 0) >= 0 ? 'var(--destaque)' : 'var(--alerta)';
    }

    function formatarDataBR(data) {
      if (!data) return '';
      const [ano, mes, dia] = data.split('-');
      const anoAbrev = ano.slice(-2);
      return `${dia}/${mes}/${anoAbrev}`;
    }

    function formatarDataISO(dataBR) {
      if (!dataBR || dataBR.length !== 10) return '';
      const [dia, mes, anoAbrev] = dataBR.split('/');
      const ano = anoAbrev.length === 2 ? '20' + anoAbrev : anoAbrev;
      return `${ano}-${mes}-${dia}`;
    }

    async function inicializar() {
      try {
        checkAuth();
        
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const unidades = await SupabaseAPI.get('unidades');
        const franquia = unidades.find(u => u.id === user.unidade_id);
        
        document.getElementById('userName').textContent = `${franquia?.nomefranquia} - ${user.nome}`;
        
        // Preencher informações da conta
        document.getElementById('infoFranquia').textContent = franquia?.nomefranquia || '-';
        document.getElementById('infoBanco').textContent = franquia?.banco || '-';
        document.getElementById('infoAgencia').textContent = franquia?.agencia || '-';
        document.getElementById('infoConta').textContent = franquia?.conta || '-';

        // Pré-preencher dados do formulário
        document.getElementById('inputBanco').value = franquia?.banco || '';
        document.getElementById('inputAgencia').value = franquia?.agencia || '';
        document.getElementById('inputConta').value = franquia?.conta || '';

        // Preencher anos
        const selectAno = document.getElementById('anoFilter');
        const anoAtual = new Date().getFullYear();
        for (let i = anoAtual - 5; i <= anoAtual; i++) {
          const option = document.createElement('option');
          option.value = i;
          option.textContent = i;
          selectAno.appendChild(option);
        }

        // Preencher select de categoria manual
        const selectCategoriaManual = document.getElementById('selectCategoriaManual');
        CATEGORIAS.forEach(cat => {
          const option = document.createElement('option');
          option.value = cat;
          option.textContent = cat;
          selectCategoriaManual.appendChild(option);
        });

        // Pré-preencher data manual com hoje
        document.getElementById('inputDataManual').valueAsDate = new Date();

        // Carregar dados
        await loadExtratos(user);
        
      } catch (error) {
        console.error('❌ Erro:', error);
      }
    }

    async function loadExtratos(user) {
      const userCurrent = user || JSON.parse(localStorage.getItem('currentUser'));
      const mes = document.getElementById('mesFilter').value;
      const ano = document.getElementById('anoFilter').value;

      try {
        let extratos = await SupabaseAPI.get('extratos');

        // Filtrar por unidade
        extratos = extratos.filter(e => e.unidade_id === userCurrent.unidade_id);

        if (mes) extratos = extratos.filter(e => e.mes === mes);
        if (ano) extratos = extratos.filter(e => e.ano === ano);

        const tbody = document.getElementById('tbody');
        tbody.innerHTML = '';

        if (extratos.length === 0) {
          tbody.innerHTML = '<tr><td colspan="11" style="text-align:center;padding:20px;">Nenhum extrato</td></tr>';
          return;
        }

        extratos.forEach(e => {
          const tr = document.createElement('tr');
          const valorFormatado = formatarValorComSinal(e.valor);
          const corVal = corValor(e.valor);
          const dataFormatada = formatarDataBR(e.data);
          const dataRef = e.data_referencia || e.data;
          const historicoCorrecao = e.historico_correcao || e.descricao;
          
          tr.innerHTML = `
            <td style="font-weight:400; color:var(--tinta); font-size:13px;">${dataFormatada}</td>
            <td style="font-size:13px; color:var(--tinta);">${e.descricao}</td>
            <td style="font-weight:600; color:${corVal}; font-size:14px;">${valorFormatado}</td>
            <td style="text-align:center; color:var(--tinta-40); font-size:12px;">${e.codigo || '-'}</td>
            <td><input type="date" value="${dataRef}" onchange="atualizarCampo(${e.id}, 'data_referencia', this.value)"></td>
            <td><input type="text" placeholder="Descrição do lançamento" value="${historicoCorrecao}" onchange="atualizarCampo(${e.id}, 'historico_correcao', this.value)"></td>
            <td>
              <select onchange="atualizarCampo(${e.id}, 'categoria', this.value)">
                <option value="">Selecione...</option>
                ${CATEGORIAS.map(c => `<option value="${c}" ${e.categoria === c ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
            </td>
            <td><input type="text" placeholder="Ex: Consultoria" value="${e.servicos || ''}" onchange="atualizarCampo(${e.id}, 'servicos', this.value)"></td>
            <td><input type="text" placeholder="Ex: Empresa X" value="${e.cliente || ''}" onchange="atualizarCampo(${e.id}, 'cliente', this.value)"></td>
            <td><input type="text" placeholder="Observações" value="${e.observacao || ''}" onchange="atualizarCampo(${e.id}, 'observacao', this.value)"></td>
            <td style="position:relative;">
              <button class="btn-menu" onclick="abrirMenuAcoes(event, ${e.id})">⋮</button>
              <div class="menu-acoes" id="menu-${e.id}" style="display:none; position:absolute; top:30px; right:0; background:white; border:1px solid var(--linha); border-radius:6px; z-index:100; min-width:160px; box-shadow:0 2px 8px rgba(0,0,0,0.1);">
                <button type="button" class="menu-item" onclick="abrirEdicaoRapida(${e.id}, 'categoria')">📋 Editar Categoria</button>
                <button type="button" class="menu-item" onclick="abrirEdicaoRapida(${e.id}, 'servicos')">🔧 Editar Serviço</button>
                <button type="button" class="menu-item" onclick="fecharMenuAcoes(); deletarExtrato(${e.id})">🗑️ Deletar</button>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });

        // Atualizar resumo de categorias
        atualizarResumoCategorias(extratos);

      } catch (error) {
        console.error('❌ Erro ao carregar:', error);
      }
    }

    async function atualizarCampo(id, campo, valor) {
      try {
        await SupabaseAPI.update('extratos', id, { [campo]: valor || null });
        console.log(`✅ ${campo} atualizado`);
      } catch (error) {
        console.error('❌ Erro:', error);
      }
    }

    async function deletarExtrato(id) {
      if (!confirm('Deletar este extrato?')) return;
      
      try {
        await SupabaseAPI.delete('extratos', id);
        const user = JSON.parse(localStorage.getItem('currentUser'));
        await loadExtratos(user);
      } catch (error) {
        console.error('❌ Erro:', error);
      }
    }

    function atualizarResumoCategorias(extratos) {
      const resumo = {};
      
      CATEGORIAS.forEach(cat => {
        resumo[cat] = 0;
      });

      extratos.forEach(e => {
        if (e.categoria && resumo.hasOwnProperty(e.categoria)) {
          resumo[e.categoria] += parseFloat(e.valor) || 0;
        }
      });

      const resumoDiv = document.getElementById('resumoCategorias');
      let html = '';

      Object.entries(resumo).forEach(([cat, valor]) => {
        if (valor !== 0) {
          const corVal = corValor(valor);
          const valorFormatado = formatarValorComSinal(valor);
          html += `
            <div class="categoria-box">
              <label>${cat}</label>
              <value style="color:${corVal};">${valorFormatado}</value>
            </div>
          `;
        }
      });

      if (html) {
        resumoDiv.innerHTML = html;
        resumoDiv.style.display = 'grid';
      } else {
        resumoDiv.style.display = 'none';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', inicializar);
    } else {
      inicializar();
    }

    // LANÇAMENTO MANUAL
    async function salvarLancamentoManual(e) {
      e.preventDefault();

      const user = JSON.parse(localStorage.getItem('currentUser'));
      const banco = document.getElementById('inputBanco').value;
      const agencia = document.getElementById('inputAgencia').value;
      const conta = document.getElementById('inputConta').value;

      const data = document.getElementById('inputDataManual').value;
      const [ano, mes, dia] = data.split('-');

      const novoLancamento = {
        unidade_id: user.unidade_id,
        banco: banco,
        agencia: agencia,
        conta: conta,
        mes: mes,
        ano: ano,
        data: data,
        descricao: document.getElementById('inputHistoricoManual').value,
        codigo: '',
        valor: parseFloat(document.getElementById('inputValorManual').value),
        historico_correcao: null,
        data_referencia: document.getElementById('inputDataRefManual').value || null,
        categoria: document.getElementById('selectCategoriaManual').value || null,
        servicos: document.getElementById('inputServicoManual').value || null,
        cliente: document.getElementById('inputClienteManual').value || null,
        observacao: document.getElementById('inputObservacaoManual').value || null
      };

      try {
        await SupabaseAPI.insert('extratos', novoLancamento);
        alert('✅ Lançamento salvo com sucesso!');
        e.target.reset();
        document.getElementById('inputDataManual').valueAsDate = new Date();
        await loadExtratos(user);
      } catch (error) {
        alert('❌ Erro: ' + error.message);
        console.error(error);
      }
    }

    // MENU DE AÇÕES
    function abrirMenuAcoes(event, id) {
      event.stopPropagation();
      
      // Fechar outros menus
      document.querySelectorAll('.menu-acoes').forEach(menu => {
        if (menu.id !== `menu-${id}`) menu.style.display = 'none';
      });

      const menu = document.getElementById(`menu-${id}`);
      menu.style.display = menu.style.display === 'none' ? 'flex' : 'none';
    }

    function fecharMenuAcoes() {
      document.querySelectorAll('.menu-acoes').forEach(menu => {
        menu.style.display = 'none';
      });
    }

    function abrirEdicaoRapida(id, campo) {
      const extratos = document.querySelectorAll('#tbody tr');
      let valor = '';

      if (campo === 'categoria') {
        const categoria = prompt('Editar Categoria:', '');
        if (categoria !== null) {
          atualizarCampo(id, 'categoria', categoria);
        }
      } else if (campo === 'servicos') {
        const servico = prompt('Editar Serviço:', '');
        if (servico !== null) {
          atualizarCampo(id, 'servicos', servico);
        }
      }

      fecharMenuAcoes();
    }

    // Fechar menu ao clicar fora
    document.addEventListener('click', function(event) {
      if (!event.target.closest('.btn-menu') && !event.target.closest('.menu-acoes')) {
        fecharMenuAcoes();
      }
    });
  </script>
</body>
</html>
