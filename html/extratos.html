<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extratos - VA Business</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <span class="logo">VA Business</span>
      <div class="menu">
        <a href="dashboard.html" class="menu-item">Dashboards</a>
        <a href="clientes.html" class="menu-item">Clientes</a>
        <a href="extratos.html" class="menu-item active">Extratos</a>
        <a href="pagamentos.html" class="menu-item">Pagamentos</a>
        <a href="configuracao.html" class="menu-item">Configuração</a>
      </div>
    </div>
    <div class="navbar-right">
      <div class="user-info">
        <span class="user-name" id="userName">Usuário</span>
        <button class="logout-btn" onclick="logout()">Sair</button>
      </div>
    </div>
  </nav>
  
  <main class="container">
    <h1>Importar Extratos</h1>
    
    <div class="upload-box">
      <label for="fileInput" class="upload-label">
        <span>📁 Selecione arquivo XLS/XLSX</span>
        <input type="file" id="fileInput" accept=".xls,.xlsx" onchange="handleFileUpload(event)">
      </label>
    </div>
    
    <div id="resultado" style="display:none; margin: 20px 0; padding: 15px; background: #e8f5e9; border-radius: 6px;">
      <p id="msg-resultado" style="color: #2e7d32;"></p>
    </div>
    
    <table id="extratosTable" style="display:none;">
      <thead>
        <tr>
          <th>Data</th>
          <th>Descrição</th>
          <th>Tipo</th>
          <th>Valor</th>
          <th>Saldo</th>
        </tr>
      </thead>
      <tbody id="tbody-extratos"></tbody>
    </table>
  </main>
  
  <script src="../js/main.js"></script>
  <script src="../js/importador.js"></script>
</body>
</html>
