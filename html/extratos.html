<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vettore Finances</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="../css/favicon.svg">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <span class="logo">Vettore</span>
      <div class="menu">
        <a href="dashboard.html" class="menu-item">Dashboard</a>
        <a href="extratos.html" class="menu-item active">Financeiro</a>
        <a href="configuracao.html" class="menu-item">Configuração</a>
      </div>
    </div>
    <div class="navbar-right">
      <span id="userName">Usuário</span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </nav>
  
  <main class="container">
    <h1>Financeiro</h1>
    
    <div class="form-section">
      <h2>Importação de Extratos Bancários</h2>
      
      <div class="form-row-3">
        <div class="form-group">
          <label>Franquia *</label>
          <select id="inputFranquiaFilt" onchange="aplicarFiltros()">
            <option value="">Selecionar...</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mês *</label>
          <select id="inputMesFilt" onchange="aplicarFiltros()">
            <option value="">Selecionar...</option>
            <option value="01">Janeiro</option>
            <option value="02">Fevereiro</option>
            <option value="03">Março</option>
            <option value="04">Abril</option>
            <option value="05">Maio</option>
            <option value="06">Junho</option>
            <option value="07">Julho</option>
            <option value="08">Agosto</option>
            <option value="09">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ano *</label>
          <select id="inputAnoFilt" onchange="aplicarFiltros()">
            <option value="">Selecionar...</option>
          </select>
        </div>
      </div>
      
      <div class="upload-area">
        <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
          📁 Selecionar Arquivo XLS/XLSX
        </button>
        <input type="file" id="fileInput" accept=".xls,.xlsx" style="display:none;" onchange="handleFileUpload(event)">
        <p id="fileName" style="margin-top: 10px; color: #666;"></p>
      </div>
      
      <div id="resultMsg" style="display:none; margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 6px; color: #2e7d32;"></div>
    </div>
    
    <table id="extratosTable" style="display: none; margin-top: 30px;">
      <thead>
        <tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th>Saldo</th><th>Ações</th></tr>
      </thead>
      <tbody id="tbodyExtratos"></tbody>
    </table>
    <p id="extratosEmpty" style="text-align: center; color: #999; padding: 20px;">Nenhum extrato importado</p>
  </main>
  
  <footer class="footer">
    <p>&copy; Vettore Finances 2026 - v1.3.2 Desenvolvido por OliverStorage</p>
  </footer>
  
  <script src="../js/auth.js"></script>
  <script src="../js/importador.js"></script>
  <script>
    let xlsxTimeout = 0;
    
    function inicializar() {
      try {
        // Verificar XLSX
        if (typeof XLSX === 'undefined') {
          xlsxTimeout++;
          if (xlsxTimeout > 50) {
            console.error('❌ XLSX não carregou após 5s. Continuando mesmo assim...');
            xlsxTimeout = 0;
          } else {
            console.log(`⏳ Aguardando XLSX... (${xlsxTimeout})`);
            setTimeout(inicializar, 100);
            return;
          }
        } else {
          console.log('✓ XLSX carregado');
        }
        
        // Verificar auth
        console.log('🔐 Verificando autenticação...');
        checkAuth();
        
        // Obter dados
        const userStr = localStorage.getItem('currentUser');
        console.log('User localStorage:', userStr ? 'existe' : 'VAZIO');
        
        if (!userStr) {
          console.error('❌ Nenhum usuário logado!');
          alert('Erro: Usuário não logado. Faça login novamente.');
          window.location.href = 'login.html';
          return;
        }
        
        const user = JSON.parse(userStr);
        console.log('✓ Usuário:', user.nome, 'Perfil:', user.perfil, 'Unidade ID:', user.unidade_id);
        console.log('User object:', JSON.stringify(user));
        
        const unidades = JSON.parse(localStorage.getItem('unidades') || '[]');
        console.log('✓ Unidades carregadas:', unidades.length);
        
        if (unidades.length === 0) {
          console.warn('⚠️ Nenhuma unidade cadastrada!');
        } else {
          console.log('Unidades:', unidades.map(u => `${u.id}:${u.nomeFranquia}`).join(', '));
        }
        
        // Encontrar franquia
        const franquia = unidades.find(u => u.id === user.unidade_id);
        console.log('🔍 Procurando franquia com ID:', user.unidade_id);
        
        if (franquia) {
          console.log('✓ Franquia encontrada:', franquia.nomeFranquia);
          console.log('   Completo:', JSON.stringify(franquia));
        } else {
          console.error('❌ Franquia NÃO encontrada!');
          console.error('   Unidades disponíveis:', unidades.map(u => u.id).join(', '));
        }
        
        // Atualizar navbar com FALLBACK robusto
        const nomeFranquia = franquia?.nomeFranquia || franquia?.nome || 'Franquia Desconhecida';
        const textoNavbar = `${nomeFranquia} - ${user.nome}`;
        
        const userNameEl = document.getElementById('userName');
        if (userNameEl) {
          userNameEl.textContent = textoNavbar;
          console.log('✓ Navbar atualizado:', textoNavbar);
        } else {
          console.error('❌ Elemento userName não encontrado!');
        }
        
        // Preencher dropdown de FRANQUIAS
        console.log('📋 Preenchendo dropdown de franquias...');
        const selectFranquia = document.getElementById('inputFranquiaFilt');
        
        if (!selectFranquia) {
          console.error('❌ Elemento inputFranquiaFilt não encontrado!');
          return;
        }
        
        // Limpar opções existentes
        selectFranquia.innerHTML = '<option value="">Selecionar...</option>';
        
        if (user.perfil === 'administrador') {
          console.log('  → Admin: mostrando todas as unidades');
          unidades.forEach(u => {
            const opt = document.createElement('option');
            opt.value = u.id;
            opt.textContent = u.nomeFranquia || u.nome || `Unidade ${u.id}`;
            selectFranquia.appendChild(opt);
            console.log(`    + ${opt.textContent} (ID: ${u.id})`);
          });
        } else {
          console.log('  → Não-Admin: mostrando apenas sua franquia');
          const opt = document.createElement('option');
          opt.value = user.unidade_id;
          opt.textContent = nomeFranquia;
          opt.selected = true;
          selectFranquia.appendChild(opt);
          selectFranquia.disabled = true;
          console.log(`    + ${opt.textContent} (ID: ${user.unidade_id}) [DISABLED]`);
        }
        
        console.log(`✓ Dropdown de franquias: ${selectFranquia.options.length} opções`);
        
        // Preencher dropdown de ANOS
        console.log('📋 Preenchendo dropdown de anos...');
        const selectAno = document.getElementById('inputAnoFilt');
        
        if (!selectAno) {
          console.error('❌ Elemento inputAnoFilt não encontrado!');
          return;
        }
        
        selectAno.innerHTML = '<option value="">Selecionar...</option>';
        
        const anoAtual = new Date().getFullYear();
        console.log(`  → Ano atual: ${anoAtual}`);
        
        for (let i = 0; i < 5; i++) {
          const ano = anoAtual - i;
          const opt = document.createElement('option');
          opt.value = ano;
          opt.textContent = ano;
          selectAno.appendChild(opt);
          console.log(`    + ${ano}`);
        }
        
        console.log(`✓ Dropdown de anos: ${selectAno.options.length} opções`);
        
        // Carregar extratos
        console.log('📊 Carregando extratos...');
        loadExtratos();
        
        console.log('✅ Inicialização completa!');
        
      } catch (error) {
        console.error('❌ Erro na inicialização:', error);
        console.error('Stack:', error.stack);
        alert('Erro ao carregar página: ' + error.message);
      }
    }
    
    console.log('🚀 Aguardando DOMContentLoaded...');
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', inicializar);
    } else {
      inicializar();
    }
  </script>
</body>
</html>
