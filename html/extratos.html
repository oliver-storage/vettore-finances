<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extratos - VA Business</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <span class="logo">VA Business</span>
      <div class="menu">
        <a href="dashboard.html" class="menu-item">Dashboard</a>
        <a href="extratos.html" class="menu-item active">Extratos</a>
        <a href="configuracao.html" class="menu-item">Configuração</a>
      </div>
    </div>
    <div class="navbar-right">
      <span id="userName">Usuário</span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </nav>
  
  <main class="container">
    <h1>Importar Extratos</h1>
    
    <div class="form-section">
      <h2>Upload de Arquivo XLS/XLSX</h2>
      <div class="upload-area">
        <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
          📁 Selecionar Arquivo
        </button>
        <input type="file" id="fileInput" accept=".xls,.xlsx" style="display:none;" onchange="handleFileUpload(event)">
        <p id="fileName" style="margin-top: 10px; color: #666;"></p>
      </div>
      
      <div id="resultMsg" style="display:none; margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 6px; color: #2e7d32;"></div>
    </div>
    
    <table id="extratosTable" style="display: none; margin-top: 30px;">
      <thead>
        <tr><th>Data</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th>Saldo</th></tr>
      </thead>
      <tbody id="tbodyExtratos"></tbody>
    </table>
    <p id="extratosEmpty" style="text-align: center; color: #999; padding: 20px;">Nenhum extrato importado</p>
  </main>
  
  <script src="../js/auth.js"></script>
  <script src="../js/importador.js"></script>
  <script>
    checkAuth();
    const user = JSON.parse(localStorage.getItem('currentUser'));
    document.getElementById('userName').textContent = user.nome;
    loadExtratos();
  </script>
</body>
</html>
