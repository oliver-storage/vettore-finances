<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vettore Finances - Financeiro</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="icon" type="image/svg+xml" href="../css/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <span class="logo">Vettore</span>
      <div class="menu">
        <a href="dashboard.html" class="menu-item">Dashboard</a>
        <a href="extratos.html" class="menu-item active">Financeiro</a>
        <a href="configuracao.html" class="menu-item">Configuração</a>
      </div>
    </div>
    <div class="navbar-right">
      <span id="userName">Usuário</span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </nav>

  <div class="container">
    <h2>Extratos Bancários</h2>
    
    <div class="form-section">
      <div class="form-row-3">
        <div class="form-group">
          <label>Franquia</label>
          <select id="franquiaFilter" onchange="loadExtratos()">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="form-group">
          <label>Mês</label>
          <select id="mesFilter" onchange="loadExtratos()">
            <option value="">Todos</option>
            <option value="01">Janeiro</option>
            <option value="02">Fevereiro</option>
            <option value="03">Março</option>
            <option value="04">Abril</option>
            <option value="05">Maio</option>
            <option value="06">Junho</option>
            <option value="07">Julho</option>
            <option value="08">Agosto</option>
            <option value="09">Setembro</option>
            <option value="10">Outubro</option>
            <option value="11">Novembro</option>
            <option value="12">Dezembro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Ano</label>
          <select id="anoFilter" onchange="loadExtratos()">
            <option value="">Todos</option>
          </select>
        </div>
      </div>
      
      <button class="btn-primary" onclick="document.getElementById('fileInput').click()">
        📤 Importar XLS/XLSX
      </button>
      <input type="file" id="fileInput" accept=".xls,.xlsx" style="display:none;" onchange="handleFileUpload(event)">
    </div>

    <div id="alertMsg" class="alert" style="display:none;"></div>

    <table id="tabelaExtratos">
      <thead>
        <tr>
          <th>Data</th>
          <th>Descrição</th>
          <th>Tipo</th>
          <th>Valor</th>
          <th>Saldo</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tbody">
      </tbody>
    </table>
  </div>

  <footer class="footer">
    <p>&copy; Vettore Finances 2026 - v1.4.0 Desenvolvido por OliverStorage</p>
  </footer>

  <script src="../js/auth.js"></script>
  <script src="../js/masks.js"></script>
  <script src="../js/importador.js"></script>

  <script>
    console.log('✅ Página extratos.html carregada');
    console.log('📦 XLSX disponível?', typeof XLSX !== 'undefined');

    function inicializar() {
      try {
        checkAuth();
        
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const unidades = JSON.parse(localStorage.getItem('unidades') || '[]');
        const franquia = unidades.find(u => u.id === user.unidade_id);
        const nomeFranquia = franquia?.nomeFranquia || franquia?.nome || 'Franquia Desconhecida';
        
        document.getElementById('userName').textContent = `${nomeFranquia} - ${user.nome}`;
        
        // Carregar dropdown de franquias IMEDIATAMENTE
        console.log('🔄 Carregando franquias...');
        const selectFranquia = document.getElementById('franquiaFilter');
        selectFranquia.innerHTML = '<option value="">Todas</option>';
        
        unidades.forEach(u => {
          const option = document.createElement('option');
          option.value = u.id;
          option.textContent = u.nomeFranquia || u.nome;
          selectFranquia.appendChild(option);
        });
        
        console.log('✅ Franquias carregadas:', unidades.length);
        
        // Carregar anos disponíveis
        const selectAno = document.getElementById('anoFilter');
        const anoAtual = new Date().getFullYear();
        for (let i = anoAtual - 5; i <= anoAtual; i++) {
          const option = document.createElement('option');
          option.value = i;
          option.textContent = i;
          selectAno.appendChild(option);
        }
        
        loadExtratos();
        
      } catch (error) {
        console.error('❌ Erro:', error);
        alert('Erro ao carregar: ' + error.message);
      }
    }

    function loadExtratos() {
      const franquiaId = document.getElementById('franquiaFilter').value;
      const mes = document.getElementById('mesFilter').value;
      const ano = document.getElementById('anoFilter').value;
      
      let extratos = JSON.parse(localStorage.getItem('extratos') || '[]');
      
      if (franquiaId) extratos = extratos.filter(e => e.unidade_id === parseInt(franquiaId));
      if (mes) extratos = extratos.filter(e => e.mes === mes);
      if (ano) extratos = extratos.filter(e => e.ano === ano.toString());
      
      const tbody = document.getElementById('tbody');
      tbody.innerHTML = '';
      
      if (extratos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; padding:20px;">Nenhum extrato encontrado</td></tr>';
        return;
      }
      
      extratos.forEach(e => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${e.data}</td>
          <td>${e.descricao}</td>
          <td><span class="badge">${e.tipo_operacao}</span></td>
          <td>R$ ${parseFloat(e.valor).toFixed(2)}</td>
          <td>R$ ${parseFloat(e.saldo).toFixed(2)}</td>
          <td>
            <button class="btn-edit" onclick="editarExtrato(${e.id})">Editar</button>
            <button class="btn-danger" onclick="deletarExtrato(${e.id})">Deletar</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      if (typeof XLSX === 'undefined') {
        alert('❌ Erro: XLSX não disponível. Aguarde um momento e tente novamente.');
        console.error('XLSX não carregado');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = e.target.result;
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[sheetName];
          const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
          
          processarExtratos(json);
        } catch (error) {
          console.error('Erro ao processar arquivo:', error);
          alert('Erro ao processar arquivo XLS');
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function processarExtratos(dados) {
      // Implementar lógica de processamento
      alert('Arquivo processado com sucesso!');
      loadExtratos();
    }

    function editarExtrato(id) {
      alert('Função de edição será implementada');
    }

    function deletarExtrato(id) {
      if (confirm('Deletar este extrato?')) {
        let extratos = JSON.parse(localStorage.getItem('extratos') || '[]');
        extratos = extratos.filter(e => e.id !== id);
        localStorage.setItem('extratos', JSON.stringify(extratos));
        loadExtratos();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', inicializar);
    } else {
      inicializar();
    }
  </script>
</body>
</html>
