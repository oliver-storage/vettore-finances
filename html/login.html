<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VA Business</title>
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-box">
      <h1>Gestão Financeira</h1>
      <p>VA Business</p>
      
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
          <span class="error" id="emailError"></span>
        </div>
        
        <div class="form-group">
          <label>Senha *</label>
          <input type="password" id="password" placeholder="Sua senha" required>
          <span class="error" id="passwordError"></span>
        </div>
        
        <div id="alertMsg" class="alert" style="display:none;"></div>
        
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      
      <div class="auth-footer">
        <p><a href="../index.html">← Voltar</a></p>
        <p style="font-size: 12px; color: #999; margin-top: 10px;">
          * Contato admin para criar usuário
        </p>
      </div>
    </div>
  </div>
  
  <footer class="footer">
    <p>&copy; Gestão Financeira 2026 - v1.0.3 Desenvolvido por OliverStorage</p>
  </footer>
  
  <script>
    function handleLogin(e) {
      e.preventDefault();
      document.getElementById('emailError').textContent = '';
      document.getElementById('passwordError').textContent = '';
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (!email) {
        document.getElementById('emailError').textContent = 'Email obrigatório';
        return;
      }
      if (!password) {
        document.getElementById('passwordError').textContent = 'Senha obrigatória';
        return;
      }
      
      const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
      const user = usuarios.find(u => u.email === email && u.senha === password);
      
      if (!user) {
        showAlert('Email ou senha inválidos', 'error');
        return;
      }
      
      localStorage.setItem('currentUser', JSON.stringify(user));
      showAlert('Login realizado!', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 1000);
    }
    
    function showAlert(msg, type) {
      const box = document.getElementById('alertMsg');
      box.textContent = msg;
      box.className = `alert alert-${type}`;
      box.style.display = 'block';
    }
  </script>
</body>
</html>
