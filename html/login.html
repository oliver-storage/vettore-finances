<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VA Business</title>
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-header">
        <h1>VA Business</h1>
        <p>Sistema Financeiro</p>
      </div>
      
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="email">Email *</label>
          <input 
            type="email" 
            id="email" 
            placeholder="seu@email.com"
            required
          >
          <span class="error-msg" id="emailError"></span>
        </div>
        
        <div class="form-group">
          <label for="password">Senha *</label>
          <input 
            type="password" 
            id="password" 
            placeholder="Sua senha"
            required
          >
          <span class="error-msg" id="passwordError"></span>
        </div>
        
        <div id="alertBox" class="alert-box" style="display: none;"></div>
        
        <button type="submit" class="btn-primary">Entrar</button>
      </form>
      
      <div class="auth-footer">
        <p>Não tem conta? <a href="cadastro.html">Cadastre-se aqui</a></p>
        <p><a href="../index.html">← Voltar à home</a></p>
      </div>
    </div>
  </div>
  
  <script>
    function handleLogin(e) {
      e.preventDefault();
      
      // Limpar erros
      document.getElementById('emailError').textContent = '';
      document.getElementById('passwordError').textContent = '';
      document.getElementById('alertBox').style.display = 'none';
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      // Validações
      if (!email) {
        document.getElementById('emailError').textContent = 'Email é obrigatório';
        return;
      }
      
      if (!password) {
        document.getElementById('passwordError').textContent = 'Senha é obrigatória';
        return;
      }
      
      // Buscar usuário
      const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
      const user = usuarios.find(u => u.email === email && u.senha === password);
      
      if (!user) {
        showAlert('Email ou senha inválidos', 'error');
        return;
      }
      
      // Login bem-sucedido
      localStorage.setItem('currentUser', JSON.stringify(user));
      showAlert('Login realizado com sucesso!', 'success');
      
      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 1000);
    }
    
    function showAlert(msg, type) {
      const box = document.getElementById('alertBox');
      box.textContent = msg;
      box.className = `alert-box alert-${type}`;
      box.style.display = 'block';
    }
  </script>
</body>
</html>
