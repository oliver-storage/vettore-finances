<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuração - VA Business</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/navbar.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-left">
      <span class="logo">VA Business</span>
      <div class="menu">
        <a href="dashboard.html" class="menu-item">Dashboard</a>
        <a href="extratos.html" class="menu-item">Extratos</a>
        <a href="configuracao.html" class="menu-item active">Configuração</a>
      </div>
    </div>
    <div class="navbar-right">
      <span id="userDisplay">Usuário</span>
      <button class="btn-logout" onclick="logout()">Sair</button>
    </div>
  </nav>
  
  <main class="container">
    <h1>Configuração</h1>
    
    <!-- NOVO USUÁRIO -->
    <div class="form-section">
      <h2>Novo Registro de Usuário</h2>
      <p class="description">Os campos com asterisco (*) são obrigatórios</p>
      
      <form onsubmit="handleNovoUsuario(event)">
        <div class="form-row-3">
          <div class="form-group">
            <label>Nome Completo *</label>
            <input type="text" id="inputNome" placeholder="Seu nome" required>
          </div>
          <div class="form-group">
            <label>Email *</label>
            <input type="email" id="inputEmail" placeholder="seu@email.com" required>
          </div>
          <div class="form-group">
            <label>Perfil *</label>
            <select id="inputPerfil" required>
              <option value="">Selecionar...</option>
              <option value="administrador">Administrador</option>
              <option value="gerente">Gerente</option>
              <option value="usuario">Usuário</option>
            </select>
          </div>
        </div>
        
        <div class="form-row-2">
          <div class="form-group">
            <label>Senha *</label>
            <input type="password" id="inputSenha" placeholder="Crie uma senha" required>
          </div>
          <div class="form-group">
            <label>Confirmar Senha *</label>
            <input type="password" id="inputConfirm" placeholder="Repita a senha" required>
          </div>
        </div>
        
        <button type="submit" class="btn-primary">+ Adicionar Usuário</button>
      </form>
    </div>
    
    <!-- LISTA DE USUÁRIOS -->
    <div class="form-section">
      <h2>Usuários Cadastrados</h2>
      
      <table id="usuariosTable" style="display: none;">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Email</th>
            <th>Perfil</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tbodyUsuarios"></tbody>
      </table>
      
      <p id="emptyMsg" style="text-align: center; color: #999; padding: 20px;">Nenhum usuário cadastrado</p>
    </div>
  </main>
  
  <script src="../js/auth.js"></script>
  <script src="../js/usuarios.js"></script>
  <script>
    window.addEventListener('load', () => {
      checkAuth();
      const user = JSON.parse(localStorage.getItem('currentUser') || '{}');
      document.getElementById('userDisplay').textContent = user.nome || 'Usuário';
      loadUsuarios();
    });
  </script>
</body>
</html>
