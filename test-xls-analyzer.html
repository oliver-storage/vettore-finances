<!DOCTYPE html>
<html>
<head>
  <title>Analisador XLS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.min.js"></script>
</head>
<body>
  <h1>Analisador de Arquivo XLS</h1>
  <input type="file" id="fileInput" accept=".xls,.xlsx">
  <pre id="output"></pre>
  
  <script>
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      const reader = new FileReader();
      
      reader.onload = (event) => {
        const data = new Uint8Array(event.target.result);
        const workbook = XLSX.read(data, {type: 'array'});
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const json = XLSX.utils.sheet_to_json(worksheet, {header: 1});
        
        let output = `📊 Estrutura do arquivo:\n`;
        output += `Linhas totais: ${json.length}\n`;
        output += `\nPrimeiras 15 linhas:\n\n`;
        
        json.slice(0, 15).forEach((row, idx) => {
          output += `Linha ${idx}: ${JSON.stringify(row)}\n`;
        });
        
        document.getElementById('output').textContent = output;
      };
      
      reader.readAsArrayBuffer(file);
    });
  </script>
</body>
</html>
